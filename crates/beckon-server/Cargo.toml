[package]
name = "beckon-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
# Programs and libraries of this project only: nothing here is published to crates.io.
publish = false

[lib]
name = "beckon_server"
path = "src/lib.rs"

[[bin]]
name = "beckon-server"
path = "src/main.rs"

[dependencies]
beckon-protocol = { path = "../beckon-protocol" }
beckon-crypto = { path = "../beckon-crypto" }
beckon-platform = { path = "../beckon-platform" }
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
thiserror.workspace = true
hostname.workspace = true
socket2 = "0.6"
base64.workspace = true
# QR codes for the terminal. No image support is wanted, only the matrix of modules.
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
rand.workspace = true
