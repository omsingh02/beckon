# The .deb, .rpm and Arch packages, all made from this one description by nfpm (https://nfpm.goreleaser.com).
# packaging/linux/build-packages.sh fills in the two placeholders below (@VERSION@, @BINARY@) and runs nfpm for each.
#
# What the packages do for the person: put Beckon in the applications menu with its icon, and set up the
# permission it needs to type (/dev/uinput: the udev rule and the module list), so nobody opens a terminal for it, and
# the names the two common firewalls need to let the phone in (ufw, firewalld).
name: beckon
arch: amd64
platform: linux
version: @VERSION@
version_schema: semver
section: utils
priority: optional
maintainer: Om Singh <omsingh02@users.noreply.github.com>
vendor: Om Singh
homepage: https://beckon.omsingh.me
license: MIT
description: |
  Your phone as a trackpad and keyboard for this computer.
  Beckon sits in the tray and shows a QR code that the Beckon app on an
  Android phone scans to pair. Then the phone is a trackpad, a keyboard and a
  media remote for this computer, over your Wi-Fi, encrypted end to end, with
  no account and nothing sent to any server.

depends:
  - libc6 (>= 2.34)
  - libgcc-s1
# Only suggested, never installed by itself. On GNOME the tray icon needs the extension, but it pulls in the whole
# GNOME Shell, which nobody on KDE, XFCE or a server wants. (Ubuntu's GNOME has it already.) And installing an
# update from the app asks for the password through polkit, which every desktop has; without it the app shows the
# command to run instead.
suggests:
  - gnome-shell-extension-appindicator
  - pkexec | policykit-1
overrides:
  rpm:
    depends:
      - glibc >= 2.34
      - libgcc
    suggests:
      - gnome-shell-extension-appindicator
      - polkit
  archlinux:
    depends:
      - glibc
      - gcc-libs
    suggests:
      - polkit

contents:
  - src: @BINARY@
    dst: /usr/bin/beckon
    file_info:
      mode: 0755
  - src: packaging/linux/beckon.desktop
    dst: /usr/share/applications/beckon.desktop
  - src: docs/brand/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/beckon.svg
  - src: packaging/icons/beckon-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/beckon.png
  - src: packaging/icons/beckon-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/beckon.png
  - src: packaging/icons/beckon-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/beckon.png
  - src: packaging/icons/beckon-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/beckon.png
  - src: packaging/icons/beckon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/beckon.png
  - src: packaging/icons/beckon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/beckon.png
  - src: packaging/icons/beckon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/beckon.png
  - src: packaging/icons/beckon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/beckon.png
  # The virtual keyboard and mouse: the module at boot, and access for whoever is at the computer.
  - src: packaging/linux/60-beckon-uinput.rules
    dst: /usr/lib/udev/rules.d/60-beckon-uinput.rules
  - src: packaging/linux/beckon-modules-load.conf
    dst: /usr/lib/modules-load.d/beckon.conf
  # The firewall, if there is one, is not opened for the person (that is theirs to decide), but it can be told in one
  # word: `sudo ufw allow Beckon`, or `sudo firewall-cmd --permanent --add-service=beckon`.
  - src: packaging/linux/ufw-beckon
    dst: /etc/ufw/applications.d/beckon
    type: config|noreplace
  - src: packaging/linux/beckon-firewalld.xml
    dst: /usr/lib/firewalld/services/beckon.xml
  # Debian looks for the license in a file called "copyright"; the others keep it with the licenses.
  - src: LICENSE
    dst: /usr/share/doc/beckon/copyright
    packager: deb
  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/doc/beckon/THIRD_PARTY_LICENSES.md
    packager: deb
  - src: LICENSE
    dst: /usr/share/licenses/beckon/LICENSE
    packager: rpm
  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/licenses/beckon/THIRD_PARTY_LICENSES.md
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/beckon/LICENSE
    packager: archlinux
  - src: THIRD_PARTY_LICENSES.md
    dst: /usr/share/licenses/beckon/THIRD_PARTY_LICENSES.md
    packager: archlinux

scripts:
  postinstall: packaging/linux/scripts/postinstall.sh
  postremove: packaging/linux/scripts/postremove.sh
